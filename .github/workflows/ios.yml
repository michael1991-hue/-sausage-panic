name: iOS prototype checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select upload-compatible Xcode
        run: python3 scripts/select-xcode.py
      - name: Test deterministic game simulation
        run: swift test
      - name: Compile iPhone simulator app
        run: xcodebuild -project SausagePanic.xcodeproj -scheme SausagePanic -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
